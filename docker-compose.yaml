version: '3.8'

services:
  network-measurement:
    build:
      context: .
      dockerfile: Dockerfile
    image: network-measurement-tool:latest
    container_name: network-measurement
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    volumes:
      - ./params_docker.json:/app/params_docker.json:ro
      - ./results:/app/results
      - ./data:/app/data
      - /lib/modules:/lib/modules:ro
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true